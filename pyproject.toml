[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-typr"
version = "0.1.0"
description = "A terminal-native typing trainer built for people who live in the terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Typr Open-Source Team" }
]
keywords = ["typing", "trainer", "terminal", "curses", "tui", "cli", "wpm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "windows-curses>=2.3.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
typr = "typr.cli:main"

[project.urls]
Homepage = "https://github.com/the-arhan/typr"
Repository = "https://github.com/the-arhan/typr"
Issues = "https://github.com/the-arhan/typr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typr = [
    "data/wordlists/*.txt",
    "data/snippets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

